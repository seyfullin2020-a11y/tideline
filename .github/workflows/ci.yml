name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tideline
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: tideline_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tideline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tideline:ci_only_password@localhost:5432/tideline_test
      SESSION_SECRET: ci-test-session-secret-not-for-production-2026
      APP_URL: http://localhost:3000
      TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
